name: Build & Compile Flutter App

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold missing platform directories
        run: |
          if [ ! -d "android" ]; then
            echo "Scaffolding Android project files..."
            flutter create --org com.vord --project-name vord .
          fi
          # Ensure Gradle subprojects ignore CheckAarMetadata and use compatible compileSdk
          if [ -f "android/build.gradle" ]; then
            printf "\nallprojects {\n    tasks.withType(com.android.build.gradle.internal.tasks.CheckAarMetadata).configureEach {\n        enabled = false\n    }\n}\nsubprojects {\n    afterEvaluate { project ->\n        if (project.hasProperty('android')) {\n            project.android {\n                if (namespace == null) {\n                    namespace project.group\n                }\n                compileSdkVersion 36\n            }\n        }\n    }\n}\n" >> android/build.gradle
          fi
          if [ -f "android/gradle.properties" ]; then
            echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle || true
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
          fi
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/<manifest [^>]*>/&\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"\/>/' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        env:
          FLUTTER_TEST: "true"
        run: flutter test

      - name: Compile Release APK
        run: flutter build apk --release --dart-define=APP_COMMIT_SHA=${{ github.sha }} --dart-define=APP_BUILD_NUMBER=${{ github.run_number }}

      - name: Sign Release APK with Production Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release signing keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ] && [ -f "$APKSIGNER" ]; then
              echo "Signing APK with apksigner ($APKSIGNER)..."
              $APKSIGNER sign --ks release.jks \
                --ks-pass pass:"$KEYSTORE_PASSWORD" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass pass:"$KEY_PASSWORD" \
                --out build/app/outputs/flutter-apk/app-release-signed.apk \
                build/app/outputs/flutter-apk/app-release.apk
                
              mv build/app/outputs/flutter-apk/app-release-signed.apk build/app/outputs/flutter-apk/app-release.apk
              
              echo "Verifying APK signature..."
              $APKSIGNER verify --verbose build/app/outputs/flutter-apk/app-release.apk
            else
              echo "Fallback to jarsigner..."
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
                build/app/outputs/flutter-apk/app-release.apk "$KEY_ALIAS"
              jarsigner -verify -verbose build/app/outputs/flutter-apk/app-release.apk
            fi
            
            rm -f release.jks
            echo "Release APK successfully signed and verified with production credentials."
          else
            echo "No signing keystore secret found, skipping signing."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vord-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish Nightly Commit Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes || true
          gh release create nightly build/app/outputs/flutter-apk/app-release.apk \
            --title "Vord Nightly Build (${{ github.sha }})" \
            --notes "Automated commit build for ${{ github.sha }}. WARNING: Bleeding-edge commit builds carry risk of data loss." \
            --prerelease || true
