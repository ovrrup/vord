name: Build & Compile Flutter App

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold missing platform directories
        run: |
          if [ ! -d "android" ]; then
            echo "Scaffolding Android project files..."
            flutter create --org com.vord --project-name vord .
          fi
          # Ensure Gradle subprojects ignore CheckAarMetadata and use compatible compileSdk
          if [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

allprojects {
    tasks.withType(com.android.build.gradle.internal.tasks.CheckAarMetadata).configureEach {
        enabled = false
    }
}
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                compileSdkVersion 36
            }
        }
    }
}
EOF
          fi
          if [ -f "android/gradle.properties" ]; then
            echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle || true
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        run: flutter test

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vord-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
